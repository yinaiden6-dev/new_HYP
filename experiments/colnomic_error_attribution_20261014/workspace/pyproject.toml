[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugpack"
version = "0.1.0"
description = "Release commands for DrugPack retrieval baselines and reference-conditioned reranking"
readme = "README.md"
requires-python = ">=3.12"
# ML environments are installed separately from the pinned requirements files.
dependencies = []

[project.optional-dependencies]
method = ["einops>=0.8.1", "rich>=14.2.0", "tqdm>=4.67.1", "matplotlib==3.10.6"]
test = ["pytest==9.1.1"]

[project.scripts]
drugpack = "drugpack.cli:main"

[tool.setuptools]
packages = ["drugpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
